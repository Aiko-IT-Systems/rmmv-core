name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version'
                required: true
                default: '2.1.1'
            prerelease:
                description: 'Prerelease'
                required: true
                type: boolean
                default: false

permissions: write-all

jobs:
    release:
        name: Release RMMV-Core
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
            - name: Install dependencies
              run: npm install
              working-directory: ./src
            - name: Validate release version
              env:
                  RELEASE_VERSION: ${{ inputs.version }}
              run: |
                  node - <<'NODE'
                  const fs = require('node:fs');
                  const pkg = require('./package.json');
                  const source = fs.readFileSync('./js/rpg_core/Utils.js', 'utf8');
                  const runtime = source.match(/Utils\.RPGMAKER_VERSION\s*=\s*["']([^"']+)["']/)?.[1];
                  if (!/^\d+\.\d+\.\d+$/.test(process.env.RELEASE_VERSION || '')) throw new Error('Release version must use x.y.z format.');
                  if (pkg.version !== process.env.RELEASE_VERSION || runtime !== pkg.version) throw new Error(`Release input (${process.env.RELEASE_VERSION}) must match package (${pkg.version}) and runtime (${runtime}).`);
                  NODE
              working-directory: ./src
            - name: Run focused unit tests
              run: npm run unittest
              working-directory: ./src
            - name: Build
              run: npm run package
              working-directory: ./src
            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: rmmv-core
                  path: src/rmmv-core.zip
            - name: Create Release
              id: create_release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: v${{ inputs.version }}
                  name: Release v${{ inputs.version }}
                  draft: false
                  prerelease: ${{ inputs.prerelease }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  generate_release_notes: true
                  files: src/rmmv-core.zip
                  target_commitish: ${{ github.ref_name }}
